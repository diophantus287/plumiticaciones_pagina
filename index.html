<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plumiticaciones</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --tag: #e0ecff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: linear-gradient(135deg, #1d4ed8, #60a5fa);
      color: white;
      padding: 2rem 1rem;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }
    h1 { margin: 0 0 .5rem; }
    .lead { margin: 0; max-width: 60ch; }
    .toolbar {
      display: grid;
      gap: 1rem;
      margin: 1.25rem 0;
    }
    .search {
      width: 100%;
      padding: .85rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: .75rem;
      background: white;
    }
    .filters {
      display: grid;
      gap: .75rem;
    }
    fieldset {
      border: 1px solid var(--border);
      border-radius: .75rem;
      padding: .75rem 1rem 1rem;
      background: white;
    }
    legend {
      padding: 0 .35rem;
      font-weight: bold;
    }
    .options {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem 1rem;
    }
    .options label {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      cursor: pointer;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin: 1rem 0;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: #e5e7eb;
    }
    .card-body {
      padding: 1rem;
    }
    .card h2 {
      margin: 0 0 .5rem;
      font-size: 1.05rem;
    }
    .card p {
      margin: 0 0 .75rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
    }
    .tag {
      display: inline-block;
      padding: .25rem .55rem;
      border-radius: 999px;
      background: var(--tag);
      color: #1e3a8a;
      font-size: .82rem;
    }
    a.card-link {
      color: inherit;
      text-decoration: none;
      display: block;
      height: 100%;
    }
    .empty {
      padding: 2rem;
      background: white;
      border: 1px dashed var(--border);
      border-radius: 1rem;
      text-align: center;
      color: var(--muted);
    }
    @media (min-width: 780px) {
      .toolbar { grid-template-columns: 1.2fr .8fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Plumiticaciones</h1>
      <p class="lead">Repositorio visual de actividades de matemáticas organizadas por curso, temática, material manipulativo y más etiquetas.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="Buscar por título, descripción o etiquetas">
      <div class="filters" id="filters"></div>
    </div>

    <div class="meta">
      <div id="count">Cargando actividades...</div>
      <div>Haz clic en una tarjeta para abrir la actividad</div>
    </div>

    <section class="grid" id="grid"></section>
    <div class="empty" id="empty" hidden>No hay actividades que coincidan con la búsqueda.</div>
  </main>

  <script>
    const CATEGORIES = ["curso", "tematica", "material"];
    const selected = {};
    let activities = [];

    CATEGORIES.forEach(cat => selected[cat] = new Set());

    const searchInput = document.getElementById("search");
    const filtersEl = document.getElementById("filters");
    const gridEl = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const emptyEl = document.getElementById("empty");

    fetch("actividades.json")
      .then(response => response.json())
      .then(data => {
        activities = data;
        renderFilters();
        renderCards();
      })
      .catch(() => {
        countEl.textContent = "No se pudo cargar el archivo actividades.json";
      });

    searchInput.addEventListener("input", renderCards);

    function renderFilters() {
      filtersEl.innerHTML = "";
      CATEGORIES.forEach(category => {
        const values = [...new Set(activities.flatMap(item => item[category] || []))].sort();
        const fieldset = document.createElement("fieldset");
        const legend = document.createElement("legend");
        legend.textContent = category;
        fieldset.appendChild(legend);

        const options = document.createElement("div");
        options.className = "options";

        values.forEach(value => {
          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.addEventListener("change", () => {
            if (checkbox.checked) selected[category].add(value);
            else selected[category].delete(value);
            renderCards();
          });
          label.appendChild(checkbox);
          label.appendChild(document.createTextNode(value));
          options.appendChild(label);
        });

        fieldset.appendChild(options);
        filtersEl.appendChild(fieldset);
      });
    }

    function matchesFilters(activity) {
      const search = searchInput.value.trim().toLowerCase();
      const haystack = [activity.titulo, activity.descripcion, ...(activity.curso || []), ...(activity.tematica || []), ...(activity.material || [])]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      if (search && !haystack.includes(search)) return false;

      return CATEGORIES.every(category => {
        if (selected[category].size === 0) return true;
        return (activity[category] || []).some(value => selected[category].has(value));
      });
    }

    function renderCards() {
      const filtered = activities.filter(matchesFilters);
      countEl.textContent = `${filtered.length} actividad${filtered.length === 1 ? "" : "es"}`;
      emptyEl.hidden = filtered.length !== 0;
      gridEl.innerHTML = filtered.map(activity => `
        <article class="card">
          <a class="card-link" href="${activity.enlace || '#'}">
            <img src="${activity.imagen || 'imagenes/placeholder.svg'}" alt="${activity.titulo}">
            <div class="card-body">
              <h2>${activity.titulo}</h2>
              <p>${activity.descripcion || ''}</p>
              <div class="tags">
                ${(activity.curso || []).map(tag => `<span class="tag">${tag}</span>`).join('')}
                ${(activity.tematica || []).map(tag => `<span class="tag">${tag}</span>`).join('')}
                ${(activity.material || []).map(tag => `<span class="tag">${tag}</span>`).join('')}
              </div>
            </div>
          </a>
        </article>
      `).join('');
    }
  </script>
</body>
</html>
