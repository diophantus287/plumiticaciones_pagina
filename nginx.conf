server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location /admin/ {
        set $admin http://mates-admin:5000;
        resolver 127.0.0.11 valid=10s;
        proxy_pass $admin;
        proxy_set_header Host $host;
    }

    location / { try_files $uri $uri/ =404; }
    location = /actividades.json { add_header Cache-Control "no-cache"; }
}
